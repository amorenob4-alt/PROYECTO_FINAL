<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}Sistema de Préstamos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="d-flex">

        <!-- SIDEBAR -->
        <div class="bg-dark text-white p-3 vh-100" style="width: 250px;">
            <h4>📦 Sistema</h4>
            <hr>

            <li class="nav-item">
                <a href="{% url 'dashboard' %}" class="nav-link text-white">
                    📊 Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'lista_equipos' %}" class="nav-link text-white">
                    💻 Equipos
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'lista_prestamos' %}" class="nav-link text-white">
                    📋 Préstamos
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'lista_usuarios' %}" class="nav-link text-white">
                    👥 Usuarios
                </a>
            </li>
            {% if is_admin %}
            <li class="nav-item">
                <a href="/admin-panel" class="nav-link text-white">
                    ⚙️ Panel de administración
                </a>
            </li>
            {% endif %}

            {% if is_usuario %}
            <li class="nav-item">
                <a href="{% url 'dashboard' %}" class="nav-link text-white">
                    ⚙️ Panel de administración
                </a>
            </li>
            {% endif %}
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="btn btn-link text-white p-0">🚪 Salir</button>
            </form>

        </div>

        <!-- CONTENIDO -->
        <div class="p-4 w-100">
            {% block content %}
            {% endblock %}
        </div>

    </div>

</body>

</html>
