{% extends "base.html" %}

{% block content %}

<h2>Usuarios del Sistema</h2>

<table class="table">
    <tr>
        <th>Usuario</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Activo</th>
    </tr>

    {% for usuario in usuarios %}
    <tr>
        <td>{{ usuario.username }}</td>
        <td>{{ usuario.first_name }} {{ usuario.last_name }}</td>
        <td>{{ usuario.email }}</td>
        <td>{{ usuario.is_active }}</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
