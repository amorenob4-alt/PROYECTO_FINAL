<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4" style="width: 350px;">

        <h3 class="text-center"> Login</h3>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <input type="text" name="username" class="form-control mb-2" placeholder="Usuario">

            <input type="password" name="password" class="form-control mb-3" placeholder="Contraseña">

            <button class="btn btn-primary w-100">Entrar</button>
        </form>

    </div>
    <p class="text-center mt-3">
        ¿No tienes una cuenta?
    </p>

    <div class="text-center">
        <a href="{% url 'registro' %}" class="btn btn-outline-primary">
            Registrarse
        </a>
    </div>

</body>

</html>
